# Software output synchronization path
SOFTWARE_DIRECTORY=""

# User files backup directory path
USER_FILES_BACKUP_DIRECTORY=""

# Machine-global AGENTS.md refreshed by UpdateAgents.ps1 (leave empty to skip)
GLOBAL_AGENTS_FILE=""

# Opt-in: assemble the Year Built prediction runner (and its model.pt) into the tray application's bin.
# Only true, 1 or yes switches it on; set it only on a machine that deploys to an ML-capable host.
# INCLUDE_YEAR_BUILT_PREDICTION_EXTENSION=true

# Opt-in: deploy the Laya runtime package and released checkpoints to SOFTWARE_DIRECTORY\DiGi.Laya.
# Only true, 1 or yes switches it on.
# INCLUDE_LAYA_MODELS=true

# Released Laya checkpoints on this machine, outside the workspace: one subfolder per model, with an optional
# <name>.calibration.json beside it (e.g. <dir>\recipe_classification\ and <dir>\recipe_classification.calibration.json).
# LAYA_MODELS_DIRECTORY=""
